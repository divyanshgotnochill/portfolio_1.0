<!doctype html>
<html lang="en" class="min-w-[320px] scroll-smooth scroll-pt-8 motion-reduce:scroll-auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#F7F5F0" />
    <script>
      (() => {
        const root = document.documentElement;
        let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

        try {
          const savedTheme = window.localStorage.getItem('divyansh-portfolio-theme');
          if (savedTheme === 'light' || savedTheme === 'dark') theme = savedTheme;
        } catch {
          // Fall back to the system preference when local storage is unavailable.
        }

        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#11100f' : '#F7F5F0';
      })();
    </script>
    <meta
      name="description"
      content="Divyansh Sahu is a full-stack developer in India building thoughtful web applications and available for freelance projects."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Divyansh Sahu — Full-Stack Developer" />
    <meta
      property="og:description"
      content="Full-stack developer in India building thoughtful web applications and available for freelance projects."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Divyansh Sahu — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Full-stack developer in India building thoughtful web applications and available for freelance projects."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Divyansh Sahu | Full-Stack Developer</title>
  </head>
  <body class="min-h-screen bg-paper font-sans text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
